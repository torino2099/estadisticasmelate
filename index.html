<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lotometría Mexicana</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: cabecera de marca, pestañas por sorteo y un tablero de tarjetas de vidrio en rejilla fluida.
   Paleta: azul marino profundo, dorado, azul brillante, rojo. Tipografía: Barlow Condensed (títulos y cifras) + Barlow (texto). */
:root{
  --bg:#0a1128; --halo-1:rgba(75,139,255,.18); --halo-2:rgba(245,192,74,.10);
  --surface:rgba(24,38,88,.5); --surface-solid:#111d46; --line:rgba(130,158,255,.2);
  --glow-a:rgba(245,192,74,.55); --glow-b:rgba(75,139,255,.5);
  --fg:#eaf0ff; --fg-2:#aab6dc; --muted:#7b88b5;
  --gold:#f5c04a; --gold-ink:#f5c04a; --blue:#4b8bff; --red:#ef4455; --green:#2fc98a;
  --gold-fill:#f5c04a; --blue-fill:rgba(75,139,255,.45);
  --cell:#16255a; --hot:#f5c04a; --cold:#4b8bff; --on-hot:#1b1400; --on-cold:#ffffff;
  --input:rgba(8,14,38,.65); --shadow:0 12px 32px rgba(2,6,24,.45);
  --font-d:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --font-b:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef2fb; --halo-1:rgba(37,99,235,.10); --halo-2:rgba(224,162,27,.14);
    --surface:rgba(255,255,255,.78); --surface-solid:#ffffff; --line:rgba(10,17,40,.14);
    --glow-a:rgba(183,121,31,.45); --glow-b:rgba(37,99,235,.4);
    --fg:#0a1128; --fg-2:#38446b; --muted:#5a6690;
    --gold:#e0a21b; --gold-ink:#8a5a00; --blue:#2563eb; --red:#c81e3a; --green:#128a5b;
    --gold-fill:#e0a21b; --blue-fill:rgba(37,99,235,.4);
    --cell:#e1e8f8; --hot:#e0a21b; --cold:#2f6fe0; --on-hot:#1b1400; --on-cold:#0a1128;
    --input:#ffffff; --shadow:0 10px 26px rgba(20,40,100,.12);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#eef2fb; --halo-1:rgba(37,99,235,.10); --halo-2:rgba(224,162,27,.14);
  --surface:rgba(255,255,255,.78); --surface-solid:#ffffff; --line:rgba(10,17,40,.14);
  --glow-a:rgba(183,121,31,.45); --glow-b:rgba(37,99,235,.4);
  --fg:#0a1128; --fg-2:#38446b; --muted:#5a6690;
  --gold:#e0a21b; --gold-ink:#8a5a00; --blue:#2563eb; --red:#c81e3a; --green:#128a5b;
  --gold-fill:#e0a21b; --blue-fill:rgba(37,99,235,.4);
  --cell:#e1e8f8; --hot:#e0a21b; --cold:#2f6fe0; --on-hot:#1b1400; --on-cold:#0a1128;
  --input:#ffffff; --shadow:0 10px 26px rgba(20,40,100,.12);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:radial-gradient(1100px 520px at 12% -8%,var(--halo-1),transparent 60%),radial-gradient(900px 480px at 100% 0%,var(--halo-2),transparent 55%),var(--bg);
  color:var(--fg); font-family:var(--font-b); font-size:15px; line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 56px; min-height:100%;
}
.wrap{max-width:1280px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* Cabecera */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand svg{flex:none;width:52px;height:52px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.brand h1{font-family:var(--font-d);font-weight:700;font-size:clamp(28px,5.2vw,44px);line-height:1;letter-spacing:.04em;text-transform:uppercase}
.brand h1 span{color:var(--gold-ink)}
.brand p{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin-top:6px;font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:10px 16px;font-weight:700;border:1px solid var(--line);background:transparent;color:var(--fg);transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover{background:color-mix(in srgb,var(--fg) 8%,transparent)}
.btn.gold{background:linear-gradient(180deg,var(--gold),color-mix(in srgb,var(--gold) 80%,#000));color:#1b1400;border-color:transparent;box-shadow:0 6px 18px color-mix(in srgb,var(--gold) 30%,transparent)}
.btn.gold:hover{transform:translateY(-1px);background:linear-gradient(180deg,var(--gold),color-mix(in srgb,var(--gold) 80%,#000))}
.btn.sm{padding:6px 12px;font-size:13px}
.btn svg{width:18px;height:18px}

/* Pestañas */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.tab{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);min-width:0;transition:border-color .2s,box-shadow .2s,background .2s}
.tab:hover{border-color:color-mix(in srgb,var(--acc) 60%,var(--line))}
.tab svg{flex:none;width:30px;height:30px;color:var(--acc)}
.tab b{display:block;font-family:var(--font-d);font-size:21px;letter-spacing:.03em;text-transform:uppercase;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab small{display:block;color:var(--muted);font-size:12px;white-space:nowrap}
.tab[aria-selected="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--surface));box-shadow:0 0 0 1px var(--acc),0 8px 26px color-mix(in srgb,var(--acc) 28%,transparent)}
@media (max-width:760px){.tabs{grid-template-columns:repeat(2,1fr)}.tab b{font-size:18px}.tab svg{width:26px;height:26px}}

/* Tarjetas */
.card{position:relative;border-radius:16px;background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--shadow);padding:18px;min-width:0}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(135deg,var(--glow-a),transparent 32%,transparent 68%,var(--glow-b));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask-composite:exclude}
.card h3{font-family:var(--font-d);font-size:23px;letter-spacing:.03em;text-transform:uppercase;line-height:1.1}
.card .sub{color:var(--muted);font-size:13px;margin-top:2px}
.card-h{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.sec{margin-top:34px}
.sec-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:14px}
.sec-h h2{font-family:var(--font-d);font-size:15px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-ink);font-weight:600;display:flex;align-items:center;gap:12px}
.sec-h h2::after{content:"";width:44px;height:1px;background:var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--input);max-width:100%}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;font-weight:600;color:var(--fg-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--acc);color:#1b1400}
.seg button:hover:not([aria-pressed="true"]){background:color-mix(in srgb,var(--fg) 8%,transparent)}

/* Esferas */
.ball{--s:40px;--bc:#e5384d;flex:none;width:var(--s);height:var(--s);border-radius:50%;display:inline-grid;place-items:center;font-family:var(--font-d);font-weight:700;font-size:calc(var(--s)*.46);line-height:1;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);font-variant-numeric:tabular-nums;
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.8) 0,rgba(255,255,255,.18) 17%,transparent 36%),radial-gradient(circle at 50% 56%,var(--bc) 0%,color-mix(in srgb,var(--bc) 62%,#000) 100%);
  box-shadow:inset -3px -5px 9px rgba(0,0,0,.35),0 3px 8px rgba(0,0,0,.3);user-select:none;border:0;padding:0}
.d0{--bc:#e5384d}.d1{--bc:#2f7df6}.d2{--bc:#f2b630;color:#2a1d00;text-shadow:0 1px 0 rgba(255,255,255,.35)}.d3{--bc:#1fae6e}.d4{--bc:#8b5cf6}.d5{--bc:#ef7d2a}
.ball.x{background:transparent;box-shadow:none;border:2px dashed var(--muted);color:var(--fg-2);text-shadow:none}
.ball[data-act]{cursor:pointer}
.ball[data-act]:hover{transform:translateY(-2px)}
.ball.hl{outline:3px solid var(--gold);outline-offset:2px}
.ball.dim{opacity:.28}
.balls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* Hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:20px 28px;align-items:center}
.hero .eyebrow{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hero h2{font-family:var(--font-d);font-size:clamp(34px,6vw,56px);text-transform:uppercase;letter-spacing:.03em;line-height:1;margin:4px 0 12px;color:var(--acc)}
.hero .last{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center}
.hero .meta{color:var(--fg-2);font-size:14px;margin-top:10px}
.hero-side{display:flex;flex-direction:column;gap:12px;align-items:flex-end;text-align:right}
.bolsa small{display:block;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
.bolsa b{font-family:var(--font-d);font-size:clamp(34px,5vw,48px);line-height:1;color:var(--gold-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12.5px;color:var(--fg-2);background:color-mix(in srgb,var(--fg) 5%,transparent)}
.chip b{color:var(--fg);font-variant-numeric:tabular-nums}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero-side{align-items:flex-start;text-align:left}}

/* Listas de ranking */
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:22px auto 1fr auto;gap:10px;align-items:center;min-width:0}
.rk{font-family:var(--font-d);font-size:17px;color:var(--muted);text-align:center}
.bar{height:8px;border-radius:4px;background:color-mix(in srgb,var(--fg) 9%,transparent);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--blue),var(--acc))}
.val{text-align:right;line-height:1.1}
.val b{font-family:var(--font-d);font-size:22px;font-variant-numeric:tabular-nums}
.val small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap}
.crow{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);min-width:0}
.crow:first-child{border-top:0;padding-top:0}
.crow .lastseen{display:block;font-size:11.5px;color:var(--muted);margin-top:4px}
.note{font-size:12.5px;color:var(--muted);margin-top:14px}

/* Tabla histórico */
.tw{overflow-x:auto;margin:0 -6px;padding:0 6px}
table{width:100%;border-collapse:collapse;min-width:640px}
th{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);vertical-align:middle;white-space:nowrap}
tbody tr:hover{background:color-mix(in srgb,var(--fg) 5%,transparent)}
td.c{font-family:var(--font-d);font-size:20px;font-variant-numeric:tabular-nums}
td.r,th.r{text-align:right}

/* Heatmap */
.heat{display:flex;flex-direction:column;gap:6px}
.hrow{display:grid;grid-template-columns:44px repeat(10,1fr);gap:5px;align-items:center}
.hlab{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.hc{aspect-ratio:1;border-radius:7px;display:grid;place-items:center;font-family:var(--font-d);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;cursor:default;border:1px solid color-mix(in srgb,var(--fg) 8%,transparent)}
.hc:hover{outline:2px solid var(--fg-2);outline-offset:1px}
.hc.e{visibility:hidden}
.scale{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);margin-top:12px}
.scale i{flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--cold),var(--cell),var(--hot))}
.dec{display:grid;grid-template-columns:48px 1fr auto auto;gap:4px 10px;align-items:center;margin-top:16px;font-size:13px}
.dec .bar i{background:var(--blue)}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:700;border:1px solid currentColor;white-space:nowrap}
.pill.hot{color:var(--gold-ink)}.pill.cold{color:var(--blue)}.pill.desert{color:var(--red)}.pill.ok{color:var(--muted)}

/* Gráficos */
.chartbox{position:relative;height:270px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--fg-2);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.alert{display:flex;gap:10px;align-items:flex-start;border:1px solid color-mix(in srgb,var(--red) 55%,transparent);background:color-mix(in srgb,var(--red) 10%,transparent);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px}
.alert svg{flex:none;width:18px;height:18px;color:var(--red);margin-top:1px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:12px}
.kv div{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kv small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kv b{font-family:var(--font-d);font-size:21px;font-variant-numeric:tabular-nums}
details{margin-top:12px;font-size:13px}
details summary{cursor:pointer;color:var(--fg-2);font-weight:600}
details table{min-width:0;margin-top:8px}
details .tw{margin:0}

.foot{margin-top:34px;font-size:13px;color:var(--muted);max-width:90ch}

/* Modal */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.scrim{position:absolute;inset:0;background:rgba(3,7,22,.72);backdrop-filter:blur(3px)}
.sheet{--acc:var(--gold);position:relative;width:min(100%,900px);max-height:100%;overflow:auto;background:var(--surface-solid);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.5);padding:22px}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.sheet h2{font-family:var(--font-d);font-size:28px;letter-spacing:.03em;text-transform:uppercase}
.x-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:22px;line-height:1}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;margin:14px 0}
.pick{--s:100%;aspect-ratio:1;width:100%;height:auto;font-size:19px}
.pick.off{background:color-mix(in srgb,var(--bc) 14%,transparent);box-shadow:none;color:var(--fg);text-shadow:none;border:1.5px solid color-mix(in srgb,var(--bc) 70%,transparent)}
.pick.off:hover{background:color-mix(in srgb,var(--bc) 30%,transparent)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.count{font-weight:600}
.count b{font-family:var(--font-d);font-size:22px}
.res{margin-top:18px;display:grid;gap:14px}
.box{border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0;background:color-mix(in srgb,var(--fg) 3%,transparent)}
.box h4{margin:0 0 10px;font-family:var(--font-d);font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-ink)}
.big{font-family:var(--font-d);font-size:clamp(28px,5vw,40px);line-height:1}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.gauge{width:min(100%,300px);display:block;margin:0 auto}
.comp{display:grid;grid-template-columns:110px 1fr 42px;gap:4px 10px;align-items:center;font-size:13px;margin-top:8px}
.comp .bar i{background:var(--acc)}
.muted{color:var(--muted)}
.hint{padding:22px;text-align:center;color:var(--fg-2);border:1px dashed var(--line);border-radius:14px}
.tabrow{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
form .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;min-width:0}
input,select{font:inherit;color:var(--fg);background:var(--input);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;width:100%;text-transform:none;letter-spacing:0;font-weight:500}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:8px}
.nums input{text-align:center;font-family:var(--font-d);font-size:22px;padding:7px 4px}
.msg{min-height:20px;margin-top:10px;font-size:13.5px}
.msg.ok{color:var(--green)}.msg.err{color:var(--red)}
.drop{display:block;border:1.5px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--fg-2)}
.status{margin-top:20px;border-top:1px solid var(--line);padding-top:14px;font-size:13px}
.status .grid{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--surface-solid);border:1px solid var(--gold);padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);font-weight:600}
#tip{position:fixed;z-index:70;pointer-events:none;background:var(--surface-solid);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;box-shadow:var(--shadow);max-width:260px}
.top-actions{display:flex;flex-wrap:wrap;gap:10px}
.ico{width:28px;height:28px;display:inline-flex;color:var(--acc);flex:none}.ico svg{width:100%;height:100%}
.rnd-cap{font-size:13px;color:var(--fg-2);margin-top:12px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}.chk input{width:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){.row{grid-template-columns:20px auto 1fr auto;gap:8px}.hrow{grid-template-columns:34px repeat(10,1fr);gap:3px}.hc{font-size:12px;border-radius:5px}.sheet{padding:16px}.comp{grid-template-columns:90px 1fr 38px}}
</style>

<div class="wrap">

function persist(){try{localStorage.setItem(LS_KEY,JSON.stringify(ADDED));return true;}catch(e){return false;}}
const cache={};
function data(g){
  if(cache[g])return cache[g];
  const map=new Map(baseMap[g]);const add=ADDED[g]||{};
  for(const k in add)map.set(+k,add[k]);
  const rows=[...map.values()].sort((a,b)=>a.c-b.c);
  return cache[g]=build(g,rows);
}
function build(g,rows){
  const max=GAMES[g].max,N=rows.length;
  const freq=new Array(max+1).fill(0),last=new Array(max+1).fill(-1);
  const evenDist=new Array(7).fill(0),primeDist=new Array(7).fill(0),sums=[];
  const prime=new Array(max+1).fill(false);for(let i=1;i<=max;i++)prime[i]=isPrime(i);
  rows.forEach((r,i)=>{
    let ev=0,pr=0,s=0;
    for(const x of r.n){freq[x]++;last[x]=i;if(x%2===0)ev++;if(prime[x])pr++;s+=x;}
    evenDist[ev]++;primeDist[pr]++;sums.push(s);
  });
  const sorted=sums.slice().sort((a,b)=>a-b);
  const q=p=>sorted[Math.round(p*(sorted.length-1))];
  const mean=sums.reduce((a,b)=>a+b,0)/N;
  const sd=Math.sqrt(sums.reduce((a,b)=>a+(b-mean)*(b-mean),0)/N);
  return {g,rows,N,max,freq,last,prime,evenDist,primeDist,sums,sumMean:mean,sumSd:sd,
    p10:q(.10),p90:q(.90),p15:q(.15),p85:q(.85),combos:null};
}
function winFreq(d,W){
  if(W==='all')return {freq:d.freq,n:d.N};
  const rows=d.rows.slice(-W);const f=new Array(d.max+1).fill(0);
  rows.forEach(r=>r.n.forEach(x=>f[x]++));
  return {freq:f,n:rows.length};
}
function cmpNums(a,b){for(let i=0;i<a.length;i++)if(a[i]!==b[i])return a[i]-b[i];return 0;}
function getCombos(d){
  if(d.combos)return d.combos;
  const m2=new Map(),m3=new Map(),m4=new Map();
  const add=(m,key,nums,i)=>{let e=m.get(key);if(!e){e={nums,count:0,last:0};m.set(key,e);}e.count++;e.last=i;};
  d.rows.forEach((r,i)=>{
    const a=r.n;
    for(let p=0;p<6;p++)for(let q=p+1;q<6;q++){
      add(m2,a[p]*64+a[q],[a[p],a[q]],i);
      for(let s=q+1;s<6;s++){
        add(m3,(a[p]*64+a[q])*64+a[s],[a[p],a[q],a[s]],i);
        for(let t=s+1;t<6;t++)add(m4,((a[p]*64+a[q])*64+a[s])*64+a[t],[a[p],a[q],a[s],a[t]],i);
      }
    }
  });
  const top=m=>[...m.values()].sort((x,y)=>y.count-x.count||y.last-x.last||cmpNums(x.nums,y.nums)).slice(0,10);
  return d.combos={2:top(m2),3:top(m3),4:top(m4)};
}
function gapOf(d,n){return d.last[n]<0?d.N:d.N-1-d.last[n];}

/* ---------- Estado de interfaz ---------- */

/* ---------- Piezas ---------- */
function ball(n,o){
  o=o||{};const s=o.s||40;
  const cls='ball d'+Math.floor((n-1)/10)+(o.x?' x':'')+(o.hl?' hl':'')+(o.dim?' dim':'');
  const at=(o.tip?' data-tip="'+esc(o.tip)+'"':'')+(o.act?' data-act="'+o.act+'" data-n="'+n+'" role="button" tabindex="0" aria-label="Número '+n+'"':'');
  return '<span class="'+cls+'" style="--s:'+s+'px"'+at+'>'+n+'</span>';
}
function ago(g,d,n){const gp=gapOf(d,n);return gp===0?'salió en el último':'hace '+fmt(gp)+(gp===1?' sorteo':' sorteos');}

/* ---------- Secciones ---------- */

function topList(d,nums,title,sub){
  const items=nums.map(n=>({n,c:d.freq[n]})).sort((a,b)=>b.c-a.c||d.last[b.n]-d.last[a.n]).slice(0,6);
  const mx=items[0].c;
  return '<div class="card"><div class="card-h"><div><h3>'+title+'</h3><p class="sub">'+sub+'</p></div></div><div class="rows">'
   +items.map((it,i)=>'<div class="row"><span class="rk">'+(i+1)+'</span>'+ball(it.n,{s:38,tip:'Número '+it.n+' · '+fmt(it.c)+' apariciones · '+pct(it.c/d.N)+' de los sorteos'})
     +'<div class="bar"><i style="width:'+(it.c/mx*100)+'%"></i></div><div class="val"><b>'+fmt(it.c)+'</b><small>'+pct(it.c/d.N)+' de sorteos</small></div></div>').join('')
   +'</div></div>';
}
function secTop(g){

   +topList(d,all.filter(n=>d.prime[n]),'Primos','Top 6 primos más frecuentes')
   +topList(d,all.filter(n=>n>1&&!d.prime[n]),'Compuestos','Top 6 compuestos más frecuentes')
   +topList(d,all,'Naturales','Top 6 números más calientes')

}
function segHTML(act,opts,sel){
  return '<div class="seg" role="group">'+opts.map(o=>'<button data-act="'+act+'" data-v="'+o[0]+'" aria-pressed="'+(String(o[0])===String(sel))+'">'+o[1]+'</button>').join('')+'</div>';
}
function secHotCold(g){
  const d=data(g),W=ui.hotW,wf=winFreq(d,W);
  const list=[...Array(d.max).keys()].map(i=>i+1).map(n=>({n,c:wf.freq[n],gap:gapOf(d,n)}));
  const hot=list.slice().sort((a,b)=>b.c-a.c||a.gap-b.gap).slice(0,10);
  const winTxt=W==='all'?'en todo el histórico':'en los últimos '+W+' sorteos';
  let cold,coldVal;
  if(ui.coldMode==='gap'){cold=list.slice().sort((a,b)=>b.gap-a.gap||a.c-b.c).slice(0,10);}
  else{cold=list.slice().sort((a,b)=>a.c-b.c||b.gap-a.gap).slice(0,10);}
  const hmx=hot[0].c||1,cmx=ui.coldMode==='gap'?(cold[0].gap||1):(Math.max(...cold.map(x=>x.c))||1);
  const hotRows=hot.map((it,i)=>'<div class="row"><span class="rk">'+(i+1)+'</span>'+ball(it.n,{s:34,tip:'Número '+it.n+' · '+fmt(it.c)+' apariciones '+winTxt})
    +'<div class="bar"><i style="width:'+(it.c/hmx*100)+'%"></i></div><div class="val"><b>'+fmt(it.c)+'</b><small>'+ago(g,d,it.n)+'</small></div></div>').join('');
  const coldRows=cold.map((it,i)=>{
    const main=ui.coldMode==='gap'?it.gap:it.c, w=ui.coldMode==='gap'?it.gap/cmx*100:Math.max(3,it.c/cmx*100);
    const small=ui.coldMode==='gap'?'sorteos sin salir':'apariciones';
    return '<div class="row"><span class="rk">'+(i+1)+'</span>'+ball(it.n,{s:34,tip:'Número '+it.n+' · '+fmt(it.c)+' apariciones '+winTxt+' · '+ago(g,d,it.n)})
    +'<div class="bar"><i style="width:'+w+'%;background:linear-gradient(90deg,var(--blue),var(--muted))"></i></div><div class="val"><b>'+fmt(main)+'</b><small>'+small+'</small></div></div>';}).join('');
  return '<section class="sec"><div class="sec-h"><h2>Calientes y fríos</h2>'+segHTML('hotw',[['all','Histórico'],['50','Últimos 50'],['100','Últimos 100']],W)+'</div>'
   +'<div class="grid g2"><div class="card"><div class="card-h"><div><h3>Calientes</h3><p class="sub">10 números con más apariciones '+winTxt+'</p></div></div><div class="rows">'+hotRows+'</div></div>'
   +'<div class="card"><div class="card-h"><div><h3>Fríos</h3><p class="sub">'+(ui.coldMode==='gap'?'10 números con más sorteos acumulados sin salir':'10 números con menos apariciones '+winTxt)+'</p></div>'
   +segHTML('coldmode',[['least','Menos apariciones'],['gap','Más tiempo sin salir']],ui.coldMode)+'</div><div class="rows">'+coldRows+'</div></div></div></section>';
}
function comboCard(d,k,title,sub,size){
  const items=getCombos(d)[k];

   +items.map((it,i)=>{const r=d.rows[it.last];
     return '<div class="crow"><span class="rk">'+(i+1)+'</span><div><div class="balls">'+it.nums.map(n=>ball(n,{s:size})).join('')+'</div><span class="lastseen">última vez: #'+r.c+' · '+fdate(r.d)+'</span></div><div class="val"><b>'+fmt(it.count)+'</b><small>veces juntos</small></div></div>';}).join('')
   +'</div>';
}
function secCombos(g){

   +comboCard(d,2,'Duetos','Top 10 parejas',32)+comboCard(d,3,'Tríos','Top 10 tercias',30)+comboCard(d,4,'Cuartetos','Top 10 grupos de 4',28)

function recentRows(d){

}
function secRecent(g){

   +'<div class="card"><div class="tw"><table><thead><tr><th>Concurso</th><th>Fecha</th><th>Números</th>'+(hasX?'<th>Adicional</th>':'')+'<th class="r">Bolsa</th></tr></thead><tbody>'
   +rows.map(r=>'<tr><td class="c">#'+r.c+'</td><td>'+fdate(r.d)+'</td><td><div class="balls" style="flex-wrap:nowrap">'+r.n.map(n=>ball(n,{s:36,act:'hl',hl:HL.has(n),dim:HL.size>0&&!HL.has(n)})).join('')+'</div></td>'
     +(hasX?'<td>'+ball(r.x,{s:36,x:1,act:'hl',hl:HL.has(r.x)})+'</td>':'')+'<td class="r num">'+fbolsa(r.b)+'</td></tr>').join('')

/* Par/impar */
function parityData(d){
  const E=Math.floor(d.max/2),O=d.max-E,tot=C(d.max,6),out=[];
  for(let e=6;e>=0;e--)out.push({e,o:6-e,label:e+'P-'+(6-e)+'I',obs:d.evenDist[e]/d.N,th:C(E,e)*C(O,6-e)/tot,count:d.evenDist[e]});
  return out;
}
function secAnalytics(g){
  const d=data(g),par=parityData(d);
  const rare=par.filter(p=>p.obs<0.03);
  const inZone=d.sums.filter(s=>s>=d.p10&&s<=d.p90).length/d.N;
  const alert=rare.length?'<div class="alert" role="note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/></svg><div><b>Combinaciones poco probables:</b> '+rare.map(p=>p.label+' ('+pct(p.obs)+', '+fmt(p.count)+' sorteos)').join(', ')+'. Una selección con todos pares o todos impares se parece muy poco a lo que ha salido.</div></div>':'';
  return '<section class="sec"><div class="sec-h"><h2>Patrones y probabilidad</h2></div><div class="grid g3">'
   // par/impar
   +'<div class="card"><div class="card-h"><div><h3>Par vs. impar</h3><p class="sub">Patrón de pares (P) e impares (I) en cada sorteo</p></div></div><div class="chartbox"><canvas id="cv-par" role="img" aria-label="Distribución par e impar, histórica y teórica"></canvas></div>'+alert
   +'<details><summary>Ver datos en tabla</summary><div class="tw"><table><thead><tr><th>Patrón</th><th class="r">Sorteos</th><th class="r">Histórico</th><th class="r">Teórico</th></tr></thead><tbody>'
   +par.map(p=>'<tr><td>'+p.label+'</td><td class="r num">'+fmt(p.count)+'</td><td class="r num">'+pct(p.obs)+'</td><td class="r num">'+pct(p.th)+'</td></tr>').join('')+'</tbody></table></div></details></div>'
   // suma
   +'<div class="card"><div class="card-h"><div><h3>Suma de la combinación</h3><p class="sub">Suma de los 6 números de cada sorteo</p></div></div>'
   +'<div class="legend"><span><i style="background:var(--gold-fill)"></i>Zona caliente (80% central)</span><span><i style="background:var(--blue-fill)"></i>Fuera de la zona</span><span><i style="background:var(--red);height:3px"></i>Curva normal</span></div>'
   +'<div class="chartbox" style="height:230px"><canvas id="cv-sum" role="img" aria-label="Histograma de la suma de los seis números"></canvas></div>'
   +'<div class="kv"><div><small>Zona caliente</small><b>'+d.p10+'–'+d.p90+'</b></div><div><small>Zona 70%</small><b>'+d.p15+'–'+d.p85+'</b></div><div><small>Promedio</small><b>'+d.sumMean.toFixed(1)+'</b></div><div><small>Desv. estándar</small><b>'+d.sumSd.toFixed(1)+'</b></div></div>'
   +'<p class="note">'+pct(inZone)+' de los sorteos suman entre '+d.p10+' y '+d.p90+'. Una selección con suma fuera de ese rango se aleja del patrón histórico.</p>'
   +'<details><summary>Ver datos en tabla</summary><div class="tw"><table><thead><tr><th>Rango de suma</th><th class="r">Sorteos</th></tr></thead><tbody>'+sumBins(d).map(b=>'<tr><td>'+b.lo+'–'+(b.lo+b.w-1)+'</td><td class="r num">'+fmt(b.n)+'</td></tr>').join('')+'</tbody></table></div></details></div>'
   // heat
   +'<div class="card" id="heat-card">'+heatHTML(g)+'</div>'
   +'</div></section>';
}
function sumBins(d){
  const w=d.max>=56?10:8,min=Math.min(...d.sums),max=Math.max(...d.sums),start=Math.floor(min/w)*w,bins=[];
  for(let lo=start;lo<=max;lo+=w)bins.push({lo,w,n:0});
  d.sums.forEach(s=>bins[Math.floor((s-start)/w)].n++);
  return bins;
}
function heatHTML(g){
  const d=data(g),W=ui.heatW,wf=winFreq(d,W),n=wf.n,exp=n*6/d.max,sd=Math.sqrt(exp*(1-6/d.max));
  const winTxt=W==='all'?'todo el histórico':'los últimos '+W+' sorteos';
  let rows='',decs='';
  const nd=Math.ceil(d.max/10);
  for(let k=0;k<nd;k++){
    const lo=k*10+1,hi=Math.min(d.max,k*10+10);let cells='',tot=0;
    for(let i=0;i<10;i++){
      const x=lo+i;
      if(x>hi){cells+='<div class="hc e"></div>';continue;}
      const c=wf.freq[x];tot+=c;
      const z=(c-exp)/sd,dev=Math.max(-1,Math.min(1,z/2.5)),a=Math.round(Math.abs(dev)*88);
      const bg=dev>=0?'color-mix(in srgb, var(--hot) '+a+'%, var(--cell))':'color-mix(in srgb, var(--cold) '+a+'%, var(--cell))';
      const col=dev>0.7?'var(--on-hot)':dev<-0.7?'var(--on-cold)':'var(--fg)';
      cells+='<div class="hc" style="background:'+bg+';color:'+col+'" data-tip="Número '+x+' · '+c+' apariciones en '+winTxt+' · esperado '+exp.toFixed(1)+'">'+x+'</div>';
    }
    rows+='<div class="hrow"><span class="hlab">'+lo+'–'+hi+'</span>'+cells+'</div>';
    const size=hi-lo+1,expD=n*6*size/d.max,ratio=tot/expD;
    const st=ratio<0.75?['desert','Desértico']:ratio<0.9?['cold','Frío']:ratio>1.1?['hot','Caliente']:['ok','Normal'];
    decs+='<span class="hlab">'+lo+'–'+hi+'</span><div class="bar"><i style="width:'+Math.min(100,ratio*50)+'%"></i></div><span class="num" style="text-align:right">'+(ratio>=1?'+':'')+Math.round((ratio-1)*100)+'%</span><span class="pill '+st[0]+'">'+st[1]+'</span>';
  }
  return '<div class="card-h"><div><h3>Mapa por decenas</h3><p class="sub">Apariciones frente a lo esperado por azar</p></div>'+segHTML('heatw',[['50','Últ. 50'],['100','Últ. 100'],['all','Histórico']],W)+'</div>'
   +'<div class="heat">'+rows+'</div><div class="scale"><span>Frío</span><i></i><span>Caliente</span></div>'
   +'<div class="dec">'+decs+'</div><p class="note">La barra marca cada decena frente a lo esperado (mitad de la barra = esperado). Se llama desértica a la que aparece 25% o más por debajo.</p>';
}
function secFoot(){
  return '<p class="foot">Los sorteos son eventos independientes. Esta información describe lo que ya ocurrió y no aumenta la probabilidad de ganar. Solo se cuentan los 6 números principales; la bola adicional se muestra pero no entra en los conteos.</p>';
}

  }).join('');

function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function drawCharts(g){
  charts.forEach(c=>c.destroy());charts=[];
  if(!window.Chart)return;
  const d=data(g);
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  Chart.defaults.font.family="'Barlow',system-ui,sans-serif";Chart.defaults.font.size=12;
  Chart.defaults.color=tok('--fg-2');Chart.defaults.animation=reduce?false:{duration:450};
  const grid=tok('--line'),muted=tok('--muted');
  const tip={backgroundColor:tok('--surface-solid'),titleColor:tok('--fg'),bodyColor:tok('--fg-2'),borderColor:tok('--line'),borderWidth:1,padding:10};
  const par=parityData(d),cp=$('#cv-par');
  if(cp)charts.push(new Chart(cp,{type:'bar',data:{labels:par.map(p=>p.label),datasets:[
    {label:'Histórico real',data:par.map(p=>+(p.obs*100).toFixed(2)),backgroundColor:tok('--gold-fill'),borderRadius:4,maxBarThickness:22},
    {label:'Teórico (azar)',data:par.map(p=>+(p.th*100).toFixed(2)),backgroundColor:tok('--blue-fill'),borderColor:tok('--blue'),borderWidth:1,borderRadius:4,maxBarThickness:22}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{boxWidth:10,boxHeight:10,color:tok('--fg-2')}},tooltip:Object.assign({},tip,{callbacks:{label:c=>c.dataset.label+': '+c.parsed.y.toFixed(1)+'%'}})},
      scales:{x:{grid:{display:false},ticks:{color:muted}},y:{beginAtZero:true,grid:{color:grid},border:{display:false},ticks:{color:muted,callback:v=>v+'%'}}}}}));
  const bins=sumBins(d),cs=$('#cv-sum');
  if(cs){
    const w=bins[0].w,mu=d.sumMean,sd=d.sumSd;
    const curve=bins.map(b=>{const x=b.lo+(w-1)/2;return +(d.N*w/(sd*Math.sqrt(2*Math.PI))*Math.exp(-((x-mu)*(x-mu))/(2*sd*sd))).toFixed(1);});
    const inz=b=>{const cx=b.lo+(w-1)/2;return cx>=d.p10&&cx<=d.p90;};
    charts.push(new Chart(cs,{data:{labels:bins.map(b=>b.lo),datasets:[

function gaugeSVG(score){
  const cx=100,cy=100,r=78,pt=(v,rr)=>{const a=Math.PI+v/100*Math.PI;return [cx+rr*Math.cos(a),cy+rr*Math.sin(a)];};
  const bands=[[0,35,'#ef4455'],[35,60,'#ef7d2a'],[60,80,'#f2b630'],[80,100,'#1fae6e']];
  const arcs=bands.map(b=>{const p1=pt(b[0],r),p2=pt(b[1],r);return '<path d="M'+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+' A'+r+' '+r+' 0 0 1 '+p2[0].toFixed(1)+' '+p2[1].toFixed(1)+'" fill="none" stroke="'+b[2]+'" stroke-width="14"/>';}).join('');

}
function calcResults(d,sel){
  const n=sel.length,max=d.max,tot=C(max,6),comb=C(n,6),N=d.N;
  const set=new Array(max+1).fill(false);sel.forEach(x=>set[x]=true);
  const tally=[0,0,0,0,0,0,0],best=[];
  d.rows.forEach(r=>{let h=0;for(const x of r.n)if(set[x])h++;tally[h]++;if(h>=4)best.push({r,h});});
  best.sort((a,b)=>b.h-a.h||b.r.c-a.r.c);
  const pk=k=>C(n,k)*C(max-n,6-k)/tot;
  const first=comb/tot;
  // historial
  let msg;
  if(n===6){
    const hit=d.rows.filter(r=>r.n.every(x=>set[x]));
    msg=hit.length?'Esta combinación exacta ya salió en el concurso <b>#'+hit[hit.length-1].c+'</b> ('+fdate(hit[hit.length-1].d)+')'+(hit.length>1?' y '+(hit.length-1)+' vez más':'')+'.':'Esta combinación exacta <b>no ha salido</b> en '+fmt(N)+' sorteos.';
  }else{
    msg=tally[6]?'Tus '+n+' números contienen el resultado completo de <b>'+tally[6]+'</b> sorteo'+(tally[6]>1?'s':'')+' pasado'+(tally[6]>1?'s':'')+'.':'Ningún sorteo pasado tuvo sus 6 números dentro de tu selección.';
  }
  const trows=[6,5,4,3].map(k=>'<tr><td>'+k+' aciertos</td><td class="r num">'+oddsText(pk(k))+'</td><td class="r num">'+fmt(tally[k])+'</td><td class="r num">'+(N*pk(k)).toFixed(1)+'</td></tr>').join('');
  const blist=best.slice(0,8).map(b=>'<div style="display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:6px 0;border-top:1px solid var(--line)"><span class="num" style="min-width:150px"><b>#'+b.r.c+'</b> · '+fdate(b.r.d)+'</span><div class="balls">'+b.r.n.map(x=>ball(x,{s:30,hl:set[x],dim:!set[x]})).join('')+'</div><span class="muted">'+b.h+' aciertos</span></div>').join('');
  // score
  const ev=sel.filter(x=>x%2===0).length,od=n-ev,pr=sel.filter(x=>d.prime[x]).length,npr=n-pr;
  const patt=(dist,A,B)=>{const mx=Math.max(...dist);let s=0;for(let j=0;j<=6;j++)s+=C(A,j)*C(B,6-j)/C(n,6)*(dist[j]/mx);return s*100;};
  const sPar=patt(d.evenDist,ev,od),sPri=patt(d.primeDist,pr,npr);
  const S=6*sel.reduce((a,b)=>a+b,0)/n,z=(S-d.sumMean)/d.sumSd,sSum=100*Math.exp(-z*z/2);
  const score=0.35*sPar+0.40*sSum+0.25*sPri;
  const label=score<35?'Atípica':score<60?'Poco común':score<80?'Típica':'Muy típica';
  const avgPr=d.primeDist.reduce((a,v,i)=>a+v*i,0)/N;
  const inZ=S>=d.p10&&S<=d.p90;
  const comp=(name,v)=>'<span>'+name+'</span><div class="bar"><i style="width:'+Math.round(v)+'%"></i></div><b class="num">'+Math.round(v)+'</b>';
  return '<div class="res">'
   +'<div class="two"><div class="box"><h4>Combinaciones posibles</h4><div class="big num">'+fmt(comb)+'</div><p class="muted" style="margin-top:6px;font-size:13px">C('+n+', 6) combinaciones de 6 números dentro de tu selección.</p></div>'
   +'<div class="box"><h4>Probabilidad del primer lugar</h4><div class="big num">'+oddsText(first)+'</div><p class="muted" style="margin-top:6px;font-size:13px">'+(first*100).toPrecision(3)+'% con tu selección. Total del sorteo: C('+max+', 6) = '+fmt(tot)+' combinaciones.</p></div></div>'
   +'<div class="box"><h4>Historial con tu selección</h4><p style="margin-bottom:10px">'+msg+'</p>'
   +'<div class="tw"><table style="min-width:480px"><thead><tr><th>Nivel</th><th class="r">Prob. teórica</th><th class="r">Sorteos pasados</th><th class="r">Esperados por azar</th></tr></thead><tbody>'+trows+'</tbody></table></div>'
   +'<p class="note" style="margin-top:8px">Probabilidad de que tu selección contenga exactamente ese número de los 6 sorteados.</p>'
   +(blist?'<div style="margin-top:12px"><b style="font-size:13px">Sorteos con 4 o más aciertos</b>'+blist+(best.length>8?'<p class="note">y '+(best.length-8)+' más.</p>':'')+'</div>':'')+'</div>'
   +'<div class="box"><h4>Coincidencia estadística</h4><div class="two" style="align-items:center"><div>'+gaugeSVG(score)+'<p style="text-align:center;margin-top:4px"><span class="big num">'+Math.round(score)+'</span><span class="muted">/100</span> · <b>'+label+'</b></p></div>'
   +'<div><div class="comp">'+comp('Par / impar',sPar)+comp('Suma',sSum)+comp('Primos',sPri)+'</div>'
   +'<p class="note" style="margin-top:12px">Pares/impares: '+ev+' / '+od+'. Suma esperada de 6 números: '+Math.round(S)+' ('+(inZ?'dentro':'fuera')+' de la zona caliente '+d.p10+'–'+d.p90+'). Primos: '+pr+' (promedio histórico '+avgPr.toFixed(1)+' por sorteo).</p></div></div>'
   +'<p class="note">El puntaje mide cuánto se parece tu selección a los patrones pasados. No cambia la probabilidad de ganar.</p></div></div>';
}

function parseDate(s){
  s=String(s||'').trim();let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/),y,mo,da;
  if(m){da=+m[1];mo=+m[2];y=+m[3];}else{m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(!m)return null;y=+m[1];mo=+m[2];da=+m[3];}
  if(mo<1||mo>12||da<1||da>31)return null;
  return y+'-'+String(mo).padStart(2,'0')+'-'+String(da).padStart(2,'0');
}
function buildRow(g,o){
  const G=GAMES[g],O={};for(const k in o)O[k.toUpperCase().trim()]=o[k];
  const n=[];for(let i=1;i<=6;i++)n.push(parseInt(O[G.pre+i],10));
  let x=null;if(G.extra){x=parseInt(O[G.pre+'7'],10);if(!(x>=1&&x<=G.max))return null;}
  const c=parseInt(O.CONCURSO,10),b=parseInt(String(O.BOLSA==null?'0':O.BOLSA).replace(/[^\d]/g,''),10)||0,dt=parseDate(O.FECHA);
  if(!(c>0)||!dt)return null;
  if(n.some(v=>!(v>=1&&v<=G.max))||new Set(n).size!==6)return null;
  return {c,n:n.sort((a,b)=>a-b),x,b,d:dt};
}
function detectGame(o){
  const ks=Object.keys(o).map(k=>k.toUpperCase().trim());
  const R=ks.filter(k=>/^R\d$/.test(k)).length,F=ks.filter(k=>/^F\d$/.test(k)).length;
  if(R===7)return 'melate';if(R===6)return 'revancha';if(F===6)return 'revanchita';if(F===7)return 'retro';return null;
}
function parseCSV(text){
  text=text.replace(/^﻿/,'');const lines=text.split(/\r?\n/).filter(l=>l.trim());if(lines.length<2)return [];
  const delim=(lines[0].match(/;/g)||[]).length>(lines[0].match(/,/g)||[]).length?';':',';
  const head=lines[0].split(delim).map(h=>h.trim().replace(/^"|"$/g,'').toUpperCase());
  return lines.slice(1).map(l=>{const v=l.split(delim).map(s=>s.trim().replace(/^"|"$/g,''));const o={};head.forEach((h,i)=>o[h]=v[i]);return o;});
}
function analyzeFile(text,name,forced){
  let groups={};const bad={};
  const feed=(g,o)=>{const gg=forced!=='auto'?forced:(g||detectGame(o));if(!gg){bad._=(bad._||0)+1;return;}const r=buildRow(gg,o);if(!r){bad[gg]=(bad[gg]||0)+1;return;}(groups[gg]=groups[gg]||[]).push(r);};
  if(/\.json$/i.test(name)||/^\s*[\[{]/.test(text)){
    const j=JSON.parse(text);
    if(Array.isArray(j))j.forEach(o=>feed(null,o));
    else for(const k in j){if(GAMES[k]&&Array.isArray(j[k]))j[k].forEach(o=>feed(k,Array.isArray(o)?arrToObj(k,o):o));}
  }else parseCSV(text).forEach(o=>feed(null,o));
  return {groups,bad};
}
function arrToObj(g,a){const G=GAMES[g],ne=G.extra?1:0,o={CONCURSO:a[0]};for(let i=1;i<=6+ne;i++)o[G.pre+i]=a[i];o.BOLSA=a[7+ne];o.FECHA=a[8+ne];return o;}
function classify(g,rows){
  const cur=new Map(data(g).rows.map(r=>[r.c,r]));let nw=0,up=0,same=0;
  rows.forEach(r=>{const e=cur.get(r.c);if(!e)nw++;else if(e.n.join()===r.n.slice().sort((a,b)=>a-b).join()&&e.x===r.x&&e.b===r.b&&e.d===r.d)same++;else up++;});
  return {nw,up,same};
}
function upsertMany(g,rows){
  ADDED[g]=ADDED[g]||{};
  rows.forEach(r=>{
    const b=baseMap[g].get(r.c);
    const same=b&&b.n.join()===r.n.join()&&b.x===r.x&&b.b===r.b&&b.d===r.d;
    if(same)delete ADDED[g][r.c];else ADDED[g][r.c]=r;
  });
  if(!Object.keys(ADDED[g]).length)delete ADDED[g];
  delete cache[g];
  return persist();
}

const ADMIN_HASH="6f8494cb907e559189f719fbaa7aba2ac957deda10453b973171a495add74aa1";
const admin={ok:false,fails:0,lockUntil:0};
async function adminHash(u,p){
  const enc=new TextEncoder();
  const key=await crypto.subtle.importKey('raw',enc.encode(u+'\n'+p),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode('lotometria-admin-v1'),iterations:150000,hash:'SHA-256'},key,256);
  return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

function rint(n){if(window.crypto&&crypto.getRandomValues){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n;}return Math.floor(Math.random()*n);}
function rndGen(g){
  const d=data(g),mx=GAMES[g].max;let a;
  for(let t=0;t<5000;t++){
    const s=new Set();while(s.size<6)s.add(1+rint(mx));
    a=[...s].sort((x,y)=>x-y);
    if(!rnd.typ)return a;
    const sum=a.reduce((p,q)=>p+q,0),ev=a.filter(x=>x%2===0).length;
    if(sum>=d.p10&&sum<=d.p90&&ev>=2&&ev<=4)return a;
  }
  return a;
}
function randomHTML(){
  const cards=ORDER.map(g=>{
    const G=GAMES[g],d=data(g),a=rnd.res[g],sum=a.reduce((p,q)=>p+q,0),ev=a.filter(x=>x%2===0).length,pr=a.filter(x=>d.prime[x]).length,inZ=sum>=d.p10&&sum<=d.p90;
    return '<div class="card" style="--acc:'+G.color+'"><div class="card-h" style="margin-bottom:12px"><div style="display:flex;gap:10px;align-items:center"><span class="ico">'+ICONS[g]+'</span><div><h3>'+G.name+'</h3><p class="sub">6 números del 1 al '+G.max+'</p></div></div></div>'
     +'<div class="balls" style="gap:8px">'+a.map(n=>ball(n,{s:44})).join('')+'</div>'
     +'<p class="rnd-cap">Suma '+sum+' ('+(inZ?'dentro':'fuera')+' de la zona caliente '+d.p10+'–'+d.p90+') · '+ev+' pares y '+(6-ev)+' impares · '+pr+(pr===1?' primo':' primos')+'</p>'
     +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn sm" data-act="rndone" data-g="'+g+'">Otra combinación</button><button class="btn sm" data-act="rndcalc" data-g="'+g+'">Analizar en la calculadora</button></div></div>';
  }).join('');
  return '<p class="muted" style="font-size:14px;margin-bottom:12px">Una combinación de 6 números por sorteo, elegida al azar. Cada combinación tiene la misma probabilidad de salir que cualquier otra.</p>'
   +'<div class="toolbar" style="margin-bottom:14px"><label class="chk"><input id="rnd-typ" type="checkbox"'+(rnd.typ?' checked':'')+'> Solo combinaciones típicas (suma en zona caliente y de 2 a 4 pares)</label>'
   +'<span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-act="rndcopy">Copiar todo</button><button class="btn gold sm" data-act="rndall">Generar todas de nuevo</button></span></div>'
   +'<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))">'+cards+'</div>';
}
function rndAll(){ORDER.forEach(g=>{rnd.res[g]=rndGen(g);});$('#modal-body').innerHTML=randomHTML();}

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act;
  if(a==='tab'){const g=t.dataset.g;if(location.hash.slice(1)===g)show(g);else location.hash=g;}
  else if(a==='hotw'){ui.hotW=t.dataset.v==='all'?'all':+t.dataset.v;rerenderSec('hot');}
  else if(a==='coldmode'){ui.coldMode=t.dataset.v;rerenderSec('hot');}
  else if(a==='heatw'){ui.heatW=t.dataset.v==='all'?'all':+t.dataset.v;rerenderSec('heat');}
  else if(a==='hl'){const n=+t.dataset.n;if(HL.has(n))HL.delete(n);else HL.add(n);rerenderSec('recent');}
  else if(a==='clearhl'){HL.clear();rerenderSec('recent');}
  else if(a==='openCalc'){calc.g=cur;calc.sel=new Set();openModal('Calculadora de probabilidad',calcShell(),'calc');renderCalc();}
  else if(a==='calcgame'){calc.g=t.dataset.g;calc.sel=new Set();$('#modal-body').innerHTML=calcShell();renderCalc();}
  else if(a==='pick'){const n=+t.dataset.n;if(calc.sel.has(n))calc.sel.delete(n);else{if(calc.sel.size>=10){toast('Máximo 10 números');return;}calc.sel.add(n);}renderCalc(n);}
  else if(a==='calcclear'){calc.sel=new Set();renderCalc();}
  else if(a==='calcrandom'){const mx=GAMES[calc.g].max;calc.sel=new Set();while(calc.sel.size<6)calc.sel.add(1+Math.floor(Math.random()*mx));renderCalc();}
  else if(a==='openLoad'){lm.tab='manual';lm.g=cur;lm.parsed=null;lm.confirmReset=false;if(admin.ok)openModal('Administrador',loadHTML(),'load');else openModal('Administrador',loginHTML(),'login');}
  else if(a==='adminout'){admin.ok=false;closeModal();toast('Sesión de administrador cerrada');}
  else if(a==='ltab'){lm.tab=t.dataset.v;lm.parsed=null;$('#modal-body').innerHTML=loadHTML();}
  else if(a==='resetadded'){
    if(!admin.ok)return;
    if(!lm.confirmReset){lm.confirmReset=true;$('#modal-body').innerHTML=loadHTML();return;}
    ADDED={};persist();ORDER.forEach(g=>delete cache[g]);lm.confirmReset=false;renderTabs();show(cur);$('#modal-body').innerHTML=loadHTML();toast('Sorteos agregados eliminados');
  }
  else if(a==='import'){
    if(!admin.ok||!lm.parsed)return;let ok=true;
    for(const g in lm.parsed.groups)ok=upsertMany(g,lm.parsed.groups[g])&&ok;
    const tot=Object.values(lm.parsed.groups).reduce((s,r)=>s+r.length,0);lm.parsed=null;
    renderTabs();show(cur);$('#modal-body').innerHTML=loadHTML();
    const m=$('#f-msg');if(m){m.className='msg '+(ok?'ok':'err');m.textContent=ok?'Importación lista: '+fmt(tot)+' filas procesadas.':'Se importó, pero este navegador no pudo guardar los datos para la próxima visita.';}
  }
  else if(a==='openRandom'){ORDER.forEach(g=>{rnd.res[g]=rndGen(g);});openModal('Números al azar',randomHTML(),'rand');}
  else if(a==='rndall')rndAll();
  else if(a==='rndone'){const g=t.dataset.g;rnd.res[g]=rndGen(g);$('#modal-body').innerHTML=randomHTML();}
  else if(a==='rndcalc'){const g=t.dataset.g;calc.g=g;calc.sel=new Set(rnd.res[g]);openModal('Calculadora de probabilidad',calcShell(),'calc');renderCalc();}
  else if(a==='rndcopy'){const txt=ORDER.map(g=>GAMES[g].name+': '+rnd.res[g].join(' - ')).join('\n');try{navigator.clipboard.writeText(txt).then(()=>toast('Combinaciones copiadas'),()=>toast('No se pudo copiar'));}catch(e){toast('No se pudo copiar');}}
  else if(a==='closeModal')closeModal();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!modal.hidden)closeModal();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.ball[data-act="hl"]')){e.preventDefault();e.target.click();}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='m-game'){lm.g=t.value;$('#modal-body').innerHTML=loadHTML();}
  else if(t.id==='rnd-typ'){rnd.typ=t.checked;rndAll();}
  else if(t.id==='f-file'&&t.files&&t.files[0]){
    const f=t.files[0],forced=$('#f-game').value,rd=new FileReader(),msg=$('#f-msg'),prev=$('#f-prev');
    rd.onload=()=>{
      try{
        const res=analyzeFile(String(rd.result),f.name,forced);lm.parsed=res;
        const gs=Object.keys(res.groups);
        if(!gs.length){prev.innerHTML='';msg.className='msg err';msg.textContent='No se encontraron filas válidas. Revisa que las columnas coincidan con el sorteo elegido.';lm.parsed=null;return;}
        const badTot=Object.values(res.bad).reduce((s,v)=>s+v,0);
        prev.innerHTML='<div class="box" style="margin-top:14px"><h4>Vista previa</h4>'+gs.map(g=>{const c=classify(g,res.groups[g]);return '<p><b>'+GAMES[g].name+'</b>: '+fmt(res.groups[g].length)+' filas válidas · '+fmt(c.nw)+' nuevas · '+fmt(c.up)+' actualizadas · '+fmt(c.same)+' sin cambios</p>';}).join('')
          +(badTot?'<p class="muted" style="font-size:13px">'+fmt(badTot)+' filas descartadas por datos inválidos.</p>':'')+'<button class="btn gold" data-act="import" style="margin-top:10px">Importar</button></div>';
        msg.textContent='';
      }catch(err){prev.innerHTML='';lm.parsed=null;msg.className='msg err';msg.textContent='No se pudo leer el archivo: '+err.message;}
    };
    rd.readAsText(f);
  }
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='mform')return;e.preventDefault();
  if(!admin.ok)return;
  const g=lm.g,G=GAMES[g],msg=$('#m-msg');
  const err=t=>{msg.className='msg err';msg.textContent=t;};
  const n=[0,1,2,3,4,5].map(i=>parseInt($('#m-n'+i).value,10));
  const x=G.extra?parseInt($('#m-x').value,10):null;
  const c=parseInt($('#m-conc').value,10),dt=parseDate($('#m-fecha').value),b=parseInt($('#m-bolsa').value,10)||0;
  if(!(c>0))return err('Escribe el número de concurso.');
  if(!dt)return err('Elige una fecha válida.');
  if(n.some(v=>!(v>=1&&v<=G.max)))return err('Los 6 números deben estar entre 1 y '+G.max+'.');
  if(new Set(n).size!==6)return err('Los 6 números no pueden repetirse.');
  if(G.extra&&!(x>=1&&x<=G.max))return err('Escribe la bola adicional (1 a '+G.max+').');
  const existed=data(g).rows.some(r=>r.c===c);
  const ok=upsertMany(g,[{c,n:n.slice().sort((a,b)=>a-b),x,b,d:dt}]);
  renderTabs();show(cur);
  $('#modal-body').innerHTML=loadHTML();
  const m=$('#m-msg');m.className='msg '+(ok?'ok':'err');
  m.textContent=(existed?'Concurso #'+c+' actualizado. ':'Concurso #'+c+' guardado. ')+(ok?'Las estadísticas ya lo incluyen.':'No se pudo guardar en este navegador; se verá solo en esta sesión.');
  const f=$('#m-n0');if(f)f.focus();
});

/* ---------- Arranque ---------- */
function route(){const g=location.hash.slice(1);show(GAMES[g]?g:'melate');}
window.addEventListener('hashchange',route);
if(window.matchMedia){const mq=window.matchMedia('(prefers-color-scheme: dark)');const h=()=>{drawCharts(cur);};if(mq.addEventListener)mq.addEventListener('change',h);}
route();
})();
</script>
